name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: python-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e . pytest ruff build
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
      - name: CLI smoke tests
        run: |
          t32
          t32 --help
          t32 --json about
          t32 --json capabilities
          t32 --json schema
          t32 --json doctor
          t32 --json profile list
          t32 test --help
          t32 skill --help
          t32 reg read --help
          t32 mem read --help
          t32 exec --help
          t32 source --help
          t32 stack --help
          t32 backend --help
          t32 context --help
          t32 frame --help
          t32 practice run --help

  build:
    name: package-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build

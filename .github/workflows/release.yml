name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag and main ancestry
        shell: python
        run: |
          import os
          import re
          import subprocess
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          pattern = r"^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$"
          if not re.fullmatch(pattern, tag):
              raise SystemExit(f"invalid SemVer release tag: {tag}")

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match package version {version}")

          subprocess.run(["git", "fetch", "origin", "main", "--no-tags"], check=True)
          result = subprocess.run(
              ["git", "merge-base", "--is-ancestor", os.environ["GITHUB_SHA"], "origin/main"]
          )
          if result.returncode != 0:
              raise SystemExit("release tag commit is not contained in main")

      - name: Build release artifacts
        run: |
          python -m pip install build
          python -m build

      - name: Smoke-test built wheel
        shell: bash
        run: |
          python -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install dist/*.whl
          .release-venv/bin/python - <<'PY'
          import os
          import trace32_cli

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if trace32_cli.__version__ != expected:
              raise SystemExit(
                  f"installed package version {trace32_cli.__version__} does not match {expected}"
              )
          PY
          .release-venv/bin/t32 --version
          .release-venv/bin/t32
          .release-venv/bin/t32 --json about
          .release-venv/bin/t32 --json capabilities
          .release-venv/bin/t32 --json schema
          .release-venv/bin/t32 skill --help

      - name: Extract changelog release notes
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## \[{re.escape(version)}\](?: - [^\n]+)?\n(.*?)(?=^## \[|\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

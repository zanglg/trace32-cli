[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trace32-cli"
version = "0.1.0"
description = "A structured CLI for Lauterbach TRACE32 via PYRCL, with Agent Skills for AI-assisted embedded debugging."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "trace32-cli contributors" }
]
keywords = [
  "trace32",
  "lauterbach",
  "pyrcl",
  "embedded-debugging",
  "debugger",
  "cli",
  "agent-skills",
  "codex",
  "pi",
  "jtag"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Debuggers"
]
dependencies = [
  "lauterbach-trace32-rcl>=1.1,<1.2",
  "tomli>=2; python_version < '3.11'"
]

[project.urls]
Homepage = "https://github.com/zanglg/trace32-cli"
Repository = "https://github.com/zanglg/trace32-cli"
Issues = "https://github.com/zanglg/trace32-cli/issues"

[project.scripts]
t32 = "trace32_cli.entry:main"

[tool.setuptools.packages.find]
include = ["trace32_cli*"]

[tool.setuptools.package-data]
trace32_cli = [
  "skills/t32/SKILL.md",
  "skills/t32/references/*.md"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The bootstrap parser predates the repository style pass and intentionally
# uses compact semicolon-separated argparse declarations. Keep CI focused on
# correctness/import issues until that parser is reformatted separately.
ignore = ["E501", "E702", "UP035"]
